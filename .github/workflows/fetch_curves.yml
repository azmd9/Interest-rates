name: Fetch Chatham Forward Curves

on:
  schedule:
    # Runs Mon-Fri at 18:00 UTC (after London close, curves updated ~16:00 UTC)
    - cron: "0 18 * * 1-5"
  workflow_dispatch:  # Allow manual trigger from GitHub UI

permissions:
  contents: write  # Needed to commit data files back to repo

jobs:
  fetch-curves:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch forward curves
        run: python fetch_curves.py

      - name: Commit and push updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          # Only commit if there are actual changes
          git diff --staged --quiet || git commit -m "data: curve snapshot $(date -u +%Y-%m-%d)"
          git push
